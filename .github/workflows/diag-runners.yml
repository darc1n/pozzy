# Throwaway diagnostic: does this repository get hosted runners at all, and does
# a macos-latest runner actually start? Two jobs, one label each, nothing else.
name: Runner diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-runners.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu runner OK: $(uname -a)"

  macos:
    runs-on: macos-latest
    steps:
      - run: |
          sw_vers
          xcodebuild -version || true
          echo "macos runner OK"
